Name: agent-earth-mgr-backend
Host: 0.0.0.0
Port: 9005

DB:
  DataSource: "postgres://wcs:123@8.146.236.193:9002/agent_earth?sslmode=disable" # pgsql连接示例

Auth:
  AccessSecret: "ae-mgr-secret-2025" # 建议在生产环境使用更复杂的随机字符串
  AccessExpire: 86400 # 24小时 (秒)

# Prometheus 配置
Prometheus:
  Host: 0.0.0.0
  Port: 9006      # metrics 端口
  Path: /metrics  # metrics 路径
Log:
  ServiceName: agent-earth-mgr-backend       # 日志中显示的服务名
  Mode: console                          # 日志输出方式：console / file / volume
  Encoding: json                        # 编码：plain 或 json
  Level: info                            # 日志级别：info / error / severe
  StackCooldownMillis: 100               # 相同堆栈日志冷却时间（ms）